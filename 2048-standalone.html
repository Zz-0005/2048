<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="2048：滑动或按方向键移动方块，相同数字合并，目标合成 2048。">
<meta name="theme-color" content="#faf8ef">
<title>2048 · 数字合并</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23bbada0'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fff'%3E2%3C/text%3E%3C/svg%3E">
<style>
/* 2048 — layout, theme and motion. Mobile-first, 320px and up. */

:root {
  --page: #faf8ef;
  --ink: #4a4038;
  --ink-strong: #2f2a24;
  --board: #bbada0;
  --cell: rgba(238, 228, 218, 0.42);
  --button: #6f5f50;
  --button-ink: #fffdf8;
  --accent: #f2b179;
  --accent-ink: #2b211a;
  --muted: #6b5e53;
  --focus: #1f6feb;
  --gap: clamp(6px, 2.2vw, 12px);
  --radius: clamp(8px, 2vw, 12px);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.08), 0 12px 28px -18px rgba(74, 64, 56, 0.55);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: min(100%, 540px);
  margin: 0 auto;
  padding:
    calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
    calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

/* Everything that goes inert while a dialog is open. */
.game {
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 2.4vw, 16px);
  min-height: calc(100vh - 38px);
  min-height: calc(100dvh - 38px);
}

/* Title, scores and buttons; on wide-but-short screens it moves beside the board. */
.panel {
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 2.4vw, 16px);
}

/* ---------- header ---------- */

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.brand__title {
  margin: 0;
  font-size: clamp(2.1rem, 10vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--ink-strong);
  font-weight: 800;
}

.brand__rule {
  margin: 4px 0 0;
  font-size: clamp(0.78rem, 3.2vw, 0.9rem);
  color: var(--muted);
}

.scores {
  display: flex;
  gap: 8px;
}

.score {
  min-width: clamp(76px, 22vw, 100px);
  padding: 7px clamp(8px, 2.6vw, 14px) 9px;
  background: #6f6156;
  border-radius: var(--radius);
  color: #fffdf8;
  text-align: center;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
}

.score--best {
  background: #5b4e44;
}

.score__label {
  display: block;
  font-size: clamp(0.62rem, 2.6vw, 0.72rem);
  letter-spacing: 0.08em;
  text-transform: none;
  color: #f2ece2;
}

.score__value {
  display: block;
  font-size: clamp(1.05rem, 4.8vw, 1.35rem);
  font-variant-numeric: tabular-nums;
  line-height: 1.25;
}

.score__value.is-bumped {
  animation: score-bump 180ms ease-out;
}

/* ---------- toolbar ---------- */

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.button {
  appearance: none;
  border: 0;
  border-radius: var(--radius);
  background: var(--button);
  color: var(--button-ink);
  font: inherit;
  font-weight: 600;
  font-size: clamp(0.9rem, 3.6vw, 1rem);
  padding: 0.6em 1.15em;
  min-height: 44px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 120ms ease, background-color 120ms ease;
}

.button:hover {
  background: #7d6b57;
}

.button:active {
  transform: translateY(1px);
}

.button--accent {
  background: var(--accent);
  color: var(--accent-ink);
}

.button--accent:hover {
  background: #f3bd8b;
}

.button--ghost {
  background: transparent;
  color: var(--ink-strong);
  box-shadow: inset 0 0 0 2px rgba(143, 122, 102, 0.5);
}

.button--ghost:hover {
  background: rgba(143, 122, 102, 0.12);
}

.button:focus-visible,
.board:focus-visible,
a:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

.status {
  margin: 0;
  flex: 1 1 100%;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: #fdf1e3;
  border: 1px solid #f0d3b0;
  color: #7a5327;
  font-size: clamp(0.76rem, 3.1vw, 0.85rem);
}

.status[hidden] {
  display: none;
}

/* ---------- board ---------- */

.board-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.board {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: var(--gap);
  background: var(--board);
  border-radius: calc(var(--radius) + 2px);
  box-shadow: var(--shadow);
  touch-action: none;
  overscroll-behavior: contain;
  user-select: none;
  -webkit-user-select: none;
}

.board__row {
  display: flex;
  gap: var(--gap);
  flex: 1;
  min-height: 0;
}

.cell {
  position: relative;
  flex: 1;
  min-width: 0;
  border-radius: var(--radius);
  background: var(--cell);
  display: grid;
  place-items: center;
  font-variant-numeric: tabular-nums;
}

.tile {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: var(--radius);
  font-weight: 800;
  font-size: clamp(1.25rem, 7vw, 2.15rem);
  color: #3b2f26;
  background: #eee4da;
  letter-spacing: -0.01em;
}

.tile[data-len="3"] {
  font-size: clamp(1.05rem, 5.8vw, 1.75rem);
}

.tile[data-len="4"] {
  font-size: clamp(0.9rem, 4.8vw, 1.45rem);
}

.tile[data-len="5"] {
  font-size: clamp(0.78rem, 4vw, 1.2rem);
}

.tile[data-len="6"] {
  font-size: clamp(0.6rem, 3.1vw, 0.95rem);
  letter-spacing: -0.04em;
}

.tile[data-value="2"] { background: #eee4da; color: #3b2f26; }
.tile[data-value="4"] { background: #ede0c8; color: #3b2f26; }
.tile[data-value="8"] { background: #f2b179; color: #3b2f26; }
.tile[data-value="16"] { background: #f59563; color: #3b2f26; }
.tile[data-value="32"] { background: #f67c5f; color: #3b2f26; }
.tile[data-value="64"] { background: #f65e3b; color: #241c16; }
.tile[data-value="128"] { background: #edcf72; color: #4a3a22; }
.tile[data-value="256"] { background: #edcc61; color: #4a3a22; }
.tile[data-value="512"] { background: #edc850; color: #4a3a22; }
.tile[data-value="1024"] { background: #edc53f; color: #4a3a22; }
.tile[data-value="2048"] { background: #edc22e; color: #3b2f26; }
.tile[data-value="4096"],
.tile[data-value="8192"],
.tile[data-value="16384"],
.tile[data-value="32768"],
.tile[data-value="65536"],
.tile[data-value="131072"] {
  background: #3c3a32;
  color: #f9f6f2;
}

.tile.is-new {
  animation: tile-in 140ms ease-out;
}

.tile.is-merged {
  animation: tile-pop 170ms ease-out;
}

.hint {
  margin: 0;
  font-size: clamp(0.78rem, 3.2vw, 0.88rem);
  color: var(--muted);
}

/* ---------- overlay ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  background: rgba(250, 248, 239, 0.82);
  backdrop-filter: blur(2px);
  animation: fade-in 140ms ease-out;
}

.overlay[hidden] {
  display: none;
}

.overlay__dialog {
  width: min(100%, 360px);
  padding: clamp(18px, 5vw, 28px);
  background: #fffdf8;
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 24px 48px -24px rgba(47, 42, 36, 0.6);
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: dialog-in 160ms ease-out;
}

.overlay__title {
  margin: 0;
  font-size: clamp(1.4rem, 6vw, 1.85rem);
  color: var(--ink-strong);
}

.overlay__detail {
  margin: 0;
  color: #6f6257;
  font-size: clamp(0.9rem, 3.6vw, 1rem);
}

.overlay__actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 6px;
}

.overlay__actions .button {
  flex: 1 1 auto;
}

.overlay--win .overlay__dialog {
  box-shadow: 0 24px 48px -24px rgba(237, 194, 46, 0.8), 0 0 0 3px rgba(237, 194, 46, 0.35);
}

/* ---------- footer ---------- */

.footer {
  margin-top: auto;
  padding-top: 6px;
  border-top: 1px solid rgba(143, 122, 102, 0.22);
  color: var(--muted);
  font-size: clamp(0.7rem, 2.9vw, 0.78rem);
}

.footer p {
  margin: 6px 0 0;
}

.footer a {
  color: #5c6b2f;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---------- motion ---------- */

@keyframes tile-in {
  from { transform: scale(0.55); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes tile-pop {
  0% { transform: scale(1); }
  55% { transform: scale(1.09); }
  100% { transform: scale(1); }
}

@keyframes score-bump {
  0% { transform: translateY(0); opacity: 1; }
  45% { transform: translateY(-5px); opacity: 0.85; }
  100% { transform: translateY(0); opacity: 1; }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes dialog-in {
  from { transform: scale(0.94); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

@media (max-width: 359px) {
  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .scores {
    width: 100%;
  }

  .score {
    flex: 1;
    min-width: 0;
  }
}

/* Landscape phones: too short for a stacked layout, so the panel sits beside
   the board and the board is capped by the viewport height instead of width. */
@media (orientation: landscape) and (max-height: 560px) {
  .app {
    width: min(100%, 900px);
    padding:
      calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }

  .game {
    display: grid;
    grid-template-columns: minmax(0, calc(100dvh - 64px)) minmax(0, 1fr);
    grid-template-areas: "board panel";
    align-items: start;
    gap: 12px;
    min-height: 0;
  }

  .board-wrap {
    grid-area: board;
    min-width: 0;
  }

  .panel {
    grid-area: panel;
    max-width: 340px;
  }

  .brand__title {
    font-size: 2rem;
  }

  .brand__rule {
    font-size: 0.72rem;
  }

  .score {
    min-width: 0;
    padding: 4px 10px 6px;
  }

  .hint {
    margin: 4px 0 0;
    font-size: 0.72rem;
  }

  /* The attribution stays on the page in every orientation (AT-017): it moves
     under the panel instead of being hidden. */
  .game {
    grid-template-areas:
      "board panel"
      "board meta";
    grid-template-rows: auto 1fr;
  }

  .footer {
    grid-area: meta;
    align-self: end;
    margin-top: 0;
    padding-top: 6px;
    font-size: 0.68rem;
  }

  .footer p {
    margin-top: 4px;
  }
}

@media (orientation: landscape) and (max-height: 380px) {
  .brand__rule {
    display: none;
  }

  /* Visually hidden rather than removed: the board's aria-describedby still
     points here, so the grid keeps its description. */
  .hint {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .brand__title {
    font-size: 1.6rem;
  }

  .game {
    grid-template-columns: minmax(0, calc(100dvh - 24px)) minmax(0, 1fr);
  }

  .footer {
    font-size: 0.64rem;
  }
}

</style>
</head>
<body>
<main class="app">
  <div class="game" id="game-surface">
  <div class="panel">
  <header class="topbar">
    <div class="brand">
      <h1 class="brand__title">2048</h1>
      <p class="brand__rule">相同数字合并，目标 2048</p>
    </div>
    <div class="scores">
      <div class="score">
        <span class="score__label">当前分数</span>
        <strong class="score__value" id="score" data-testid="score">0</strong>
      </div>
      <div class="score score--best">
        <span class="score__label">最高分</span>
        <strong class="score__value" id="best" data-testid="best">0</strong>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <button type="button" class="button" id="new-game" data-testid="new-game">新局</button>
    <button type="button" class="button button--accent" id="resume-win" data-testid="resume-win" hidden>继续游戏</button>
    <p class="status" id="storage-status" data-testid="storage-status" role="status" hidden>
      存储不可用：最高分仅在本次打开期间保留。
    </p>
  </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" data-testid="board" role="grid" aria-label="2048 棋盘，4 行 4 列" aria-describedby="board-help" tabindex="0">
      <div class="board__row" role="row">
        <div class="cell" role="gridcell" data-index="0" data-testid="cell-0" aria-label="第 1 行第 1 列，空"></div>
        <div class="cell" role="gridcell" data-index="1" data-testid="cell-1" aria-label="第 1 行第 2 列，空"></div>
        <div class="cell" role="gridcell" data-index="2" data-testid="cell-2" aria-label="第 1 行第 3 列，空"></div>
        <div class="cell" role="gridcell" data-index="3" data-testid="cell-3" aria-label="第 1 行第 4 列，空"></div>
      </div>
      <div class="board__row" role="row">
        <div class="cell" role="gridcell" data-index="4" data-testid="cell-4" aria-label="第 2 行第 1 列，空"></div>
        <div class="cell" role="gridcell" data-index="5" data-testid="cell-5" aria-label="第 2 行第 2 列，空"></div>
        <div class="cell" role="gridcell" data-index="6" data-testid="cell-6" aria-label="第 2 行第 3 列，空"></div>
        <div class="cell" role="gridcell" data-index="7" data-testid="cell-7" aria-label="第 2 行第 4 列，空"></div>
      </div>
      <div class="board__row" role="row">
        <div class="cell" role="gridcell" data-index="8" data-testid="cell-8" aria-label="第 3 行第 1 列，空"></div>
        <div class="cell" role="gridcell" data-index="9" data-testid="cell-9" aria-label="第 3 行第 2 列，空"></div>
        <div class="cell" role="gridcell" data-index="10" data-testid="cell-10" aria-label="第 3 行第 3 列，空"></div>
        <div class="cell" role="gridcell" data-index="11" data-testid="cell-11" aria-label="第 3 行第 4 列，空"></div>
      </div>
      <div class="board__row" role="row">
        <div class="cell" role="gridcell" data-index="12" data-testid="cell-12" aria-label="第 4 行第 1 列，空"></div>
        <div class="cell" role="gridcell" data-index="13" data-testid="cell-13" aria-label="第 4 行第 2 列，空"></div>
        <div class="cell" role="gridcell" data-index="14" data-testid="cell-14" aria-label="第 4 行第 3 列，空"></div>
        <div class="cell" role="gridcell" data-index="15" data-testid="cell-15" aria-label="第 4 行第 4 列，空"></div>
      </div>
    </div>
    <p class="hint" id="board-help">使用方向键或滑动移动方块，相同数字合并，目标合成 2048。</p>
  </div>

  <footer class="footer">
    <p>版本 1.0.0 · MIT License</p>
    <p>
      参考
      <a href="https://github.com/gabrielecirulli/2048" rel="noopener noreferrer" target="_blank">gabrielecirulli/2048</a>，
      原作者 Gabriele Cirulli；本项目改动见 NOTICE.md。
    </p>
  </footer>
  </div>

  <p class="visually-hidden" id="announcer" role="status" aria-live="polite" aria-atomic="true"></p>

  <div class="overlay" id="overlay" data-testid="overlay" hidden>
    <div class="overlay__dialog" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-detail">
      <h2 class="overlay__title" id="overlay-title" data-testid="overlay-title">你赢了</h2>
      <p class="overlay__detail" id="overlay-detail" data-testid="overlay-detail"></p>
      <div class="overlay__actions">
        <button type="button" class="button" id="overlay-primary" data-testid="overlay-primary">继续游戏</button>
        <button type="button" class="button button--ghost" id="overlay-secondary" data-testid="overlay-secondary">重新开始</button>
      </div>
    </div>
  </div>
</main>

<script>
/* 2048 — engine + UI (static, no build step).
 * Engine layer: pure functions and a session object, no DOM.
 * Loaded by the page and by node tests.
 */
(function (root, factory) {
  'use strict';
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.Game2048 = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var SIZE = 4;
  var DIRECTIONS = ['left', 'right', 'up', 'down'];
  var BEST_KEY = 'bestScore';
  var EVENT_LOG_LIMIT = 500;

  /* PRD 7.2: the only fields an event may carry. */
  var EVENT_FIELDS = {
    game_start: ['source'],
    move: ['direction', 'score', 'maxTile', 'moves'],
    merge: ['mergedValue', 'score'],
    game_win: ['moves', 'durationMs'],
    game_over: ['score', 'maxTile', 'moves', 'durationMs'],
    restart: ['score'],
    storage_error: ['operation', 'key'],
  };

  function emptyBoard() {
    var board = [];
    for (var i = 0; i < SIZE * SIZE; i++) board.push(0);
    return board;
  }

  function boardFromRows(rows) {
    var board = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) board.push((rows[r] && rows[r][c]) || 0);
    }
    return board;
  }

  function rowsOf(board) {
    var rows = [];
    for (var r = 0; r < SIZE; r++) rows.push(board.slice(r * SIZE, r * SIZE + SIZE));
    return rows;
  }

  /* Read from the movement side: compact zeros, merge equal neighbours once,
     pad with zeros. The caller reverses the line for `right`/`down`. */
  function slideLine(line) {
    var out = [];
    var gained = 0;
    var merges = [];
    var mergePositions = [];
    var tiles = line.filter(function (v) { return v !== 0; });

    for (var i = 0; i < tiles.length; i++) {
      if (i + 1 < tiles.length && tiles[i] === tiles[i + 1]) {
        var merged = tiles[i] * 2;
        out.push(merged);
        mergePositions.push(out.length - 1);
        merges.push(merged);
        gained += merged;
        i++;
      } else {
        out.push(tiles[i]);
      }
    }
    while (out.length < SIZE) out.push(0);

    return { line: out, gained: gained, merges: merges, mergePositions: mergePositions };
  }

  function moveBoard(board, direction) {
    var rows = rowsOf(board);
    var next = rows.map(function (row) { return row.slice(); });
    var gained = 0;
    var merges = [];
    var mergedIndices = [];

    function applyTo(line, toBoardIndex) {
      var result = slideLine(line);
      gained += result.gained;
      merges = merges.concat(result.merges);
      for (var k = 0; k < result.mergePositions.length; k++) {
        mergedIndices.push(toBoardIndex(result.mergePositions[k]));
      }
      return result.line;
    }

    if (direction === 'left' || direction === 'right') {
      for (var r = 0; r < SIZE; r++) {
        if (direction === 'right') {
          next[r] = applyTo(next[r].slice().reverse(), function (j) {
            return r * SIZE + (SIZE - 1 - j);
          }).reverse();
        } else {
          next[r] = applyTo(next[r], function (j) { return r * SIZE + j; });
        }

        if (direction === 'down') column.reverse();

        for (var r2 = 0; r2 < SIZE; r2++) next[r2][c] = slid[r2];

    for (var i = 0; i < resultBoard.length; i++) {

      if (DIRECTIONS.indexOf(direction) === -1) {

      } else if (!canMove(state.board)) {

      return {
        moved: true,
        direction: direction,
        gained: result.gained,
        merges: result.merges,
        mergedIndices: result.mergedIndices,

    s: 'down',

    W: 'up',

        game.continueAfterWin();
        render({ moved: false });
        announce('继续游戏，当前分数 ' + game.state.score);
        focusBoardIfIdle();
      } else {
        game.restart();
        render({ moved: false });
        announce(STRINGS.newGame);
        focusBoardIfIdle();
      }
    });

    secondaryEl.addEventListener('click', function () {
      game.restart();
      render({ moved: false });
      announce(STRINGS.newGame);
      focusBoardIfIdle();
    });

    doc.addEventListener('visibilitychange', function () {
      if (doc.visibilityState === 'hidden') game.persist();
    });

    /* ---------- boot ---------- */

    startGame(STRINGS.newGame);

    var handle = {
      game: game,
      state: function () { return game.state; },
      events: game.events,
      setBoard: function (rows, opts) {
        game.setBoard(rows, opts);
        render({ moved: false });
        return game.state;
      },
      press: function (direction) { return applyMove(direction); },
      overlayKind: function () { return overlayKind; },
    };
    win.__2048 = handle;
    return handle;
  }

  var api = {
    SIZE: SIZE,
    DIRECTIONS: DIRECTIONS,
    EVENT_FIELDS: EVENT_FIELDS,
    STRINGS: STRINGS,
    emptyBoard: emptyBoard,
    boardFromRows: boardFromRows,
    rowsOf: rowsOf,
    slideLine: slideLine,
    moveBoard: moveBoard,
    canMove: canMove,
    createStorage: createStorage,
    memoryBackend: memoryBackend,
    createGame: createGame,
    mount: mount,
  };

  return api;
});

/* Boot the page only when a document exists (node tests import the module). */
(function () {
  'use strict';
  if (typeof document === 'undefined') return;
  var start = function () { window.Game2048.mount(document); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
</body>
</html>
