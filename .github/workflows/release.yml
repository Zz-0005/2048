name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the v2.0.0 release if it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "release v2.0.0 already exists, nothing to do"
            exit 0
          fi
          gh release create v2.0.0 \
            --title "2048 v2.0.0" \
            --notes-file docs/release-notes-v2.0.0.md \
            --verify-tag \
            "2048-standalone.html#2048-standalone.html（离线单文件，存进手机即可玩）"
          echo "--- published ---"
          gh release view v2.0.0 --json tagName,name,url,assets
